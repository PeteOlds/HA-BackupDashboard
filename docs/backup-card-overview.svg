<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="920" height="540" fill="#181818"/>
  <rect x="20" y="20" width="880" height="500" rx="12" fill="#1f1f1f" stroke="#333" stroke-width="1"/>

  <!-- Header -->
  <text x="44" y="64" fill="#e8e8e8" font-size="22" font-weight="700">Backups</text>
  <rect x="150" y="46" width="78" height="26" rx="13" fill="#1f3b1f" stroke="#4caf50"/>
  <text x="189" y="63" fill="#4caf50" font-size="13" font-weight="600" text-anchor="middle">GREEN</text>
  <rect x="740" y="42" width="130" height="34" rx="6" fill="#03a9f4"/>
  <text x="805" y="64" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Backup Now</text>

  <!-- Metrics -->
  <g font-size="13" fill="#9a9a9a">
    <text x="44" y="104">Local: <tspan fill="#e8e8e8" font-weight="600">3</tspan></text>
    <text x="184" y="104">Remote: <tspan fill="#e8e8e8" font-weight="600">1</tspan></text>
    <text x="344" y="104">Last backup: <tspan fill="#e8e8e8" font-weight="600">2h ago</tspan></text>
    <text x="564" y="104">Schedule: <tspan fill="#e8e8e8" font-weight="600">Daily 02:00</tspan></text>
    <text x="744" y="104">Used: <tspan fill="#e8e8e8" font-weight="600">42.1 GB</tspan></text>
  </g>
  <line x1="44" y1="124" x2="876" y2="124" stroke="#333"/>

  <!-- Table header -->
  <g font-size="13" font-weight="600" fill="#bdbdbd">
    <text x="44" y="156">Name</text>
    <text x="300" y="156">Created</text>
    <text x="430" y="156">File Size (Mb)</text>
    <text x="580" y="156">Location</text>
    <text x="720" y="156">Type</text>
    <text x="820" y="156">Actions</text>
  </g>
  <line x1="44" y1="168" x2="876" y2="168" stroke="#333"/>

  <!-- Row 1 -->
  <g font-size="13" fill="#e0e0e0">
    <text x="44" y="198">Auto Backup 2026-08-24</text>
    <text x="300" y="198">2h ago</text>
    <text x="430" y="198">1234 MB</text>
    <rect x="580" y="184" width="58" height="20" rx="10" fill="#2a2a2a"/><text x="609" y="198" font-size="11" fill="#9a9a9a" text-anchor="middle">Local</text>
    <text x="720" y="198">Automatic</text>
    <text x="820" y="198" fill="#03a9f4" font-size="12">Restore</text>
    <text x="820" y="214" fill="#f44336" font-size="12">Delete</text>
  </g>
  <line x1="44" y1="226" x2="876" y2="226" stroke="#2a2a2a"/>

  <!-- Row 2 -->
  <g font-size="13" fill="#e0e0e0">
    <text x="44" y="256">Manual 2026-08-23</text>
    <text x="300" y="256">1d ago</text>
    <text x="430" y="256">987 MB</text>
    <rect x="580" y="242" width="58" height="20" rx="10" fill="#2a2a2a"/><text x="609" y="256" font-size="11" fill="#9a9a9a" text-anchor="middle">Local</text>
    <rect x="644" y="242" width="64" height="20" rx="10" fill="#2a2a2a"/><text x="676" y="256" font-size="11" fill="#9a9a9a" text-anchor="middle">Remote</text>
    <text x="720" y="256">Manual</text>
    <text x="820" y="256" fill="#03a9f4" font-size="12">Restore</text>
    <text x="820" y="272" fill="#f44336" font-size="12">Delete</text>
  </g>
  <line x1="44" y1="284" x2="876" y2="284" stroke="#2a2a2a"/>

  <!-- Row 3 -->
  <g font-size="13" fill="#e0e0e0">
    <text x="44" y="314">Auto Backup 2026-08-16</text>
    <text x="300" y="314">8d ago</text>
    <text x="430" y="314">1543 MB</text>
    <rect x="580" y="300" width="58" height="20" rx="10" fill="#2a2a2a"/><text x="609" y="314" font-size="11" fill="#9a9a9a" text-anchor="middle">Local</text>
    <text x="720" y="314">Automatic</text>
    <text x="820" y="314" fill="#03a9f4" font-size="12">Restore</text>
    <text x="820" y="330" fill="#f44336" font-size="12">Delete</text>
  </g>

  <!-- Pager -->
  <text x="44" y="476" fill="#9a9a9a" font-size="12">1 / 2</text>
  <rect x="800" y="462" width="34" height="24" rx="4" fill="#2a2a2a"/><text x="817" y="478" fill="#e0e0e0" font-size="12" text-anchor="middle">›</text>

  <text x="44" y="512" fill="#666" font-size="11" font-style="italic">Mock-up — illustrative, not a live capture</text>
</svg>
