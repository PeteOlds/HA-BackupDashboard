<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="520" height="440" fill="#000000" opacity="0.4"/>
  <rect x="60" y="40" width="400" height="360" rx="10" fill="#1f1f1f" stroke="#333"/>
  <text x="84" y="78" fill="#e8e8e8" font-size="18" font-weight="700">Backup Now</text>
  <line x1="84" y1="96" x2="436" y2="96" stroke="#333"/>

  <!-- Full / Partial -->
  <text x="84" y="128" fill="#bdbdbd" font-size="13" font-weight="600">Scope</text>
  <rect x="84" y="140" width="14" height="14" rx="7" fill="#03a9f4"/>
  <text x="108" y="152" fill="#e0e0e0" font-size="13">Full backup</text>
  <rect x="240" y="140" width="14" height="14" rx="7" fill="none" stroke="#777"/>
  <text x="264" y="152" fill="#e0e0e0" font-size="13">Partial (add-ons)</text>

  <!-- Password -->
  <text x="84" y="196" fill="#bdbdbd" font-size="13" font-weight="600">Password (optional)</text>
  <rect x="84" y="208" width="332" height="32" rx="4" fill="#2a2a2a" stroke="#444"/>
  <text x="96" y="228" fill="#777" font-size="12">••••••••</text>

  <!-- Agents -->
  <text x="84" y="272" fill="#bdbdbd" font-size="13" font-weight="600">Target agents</text>
  <rect x="84" y="284" width="14" height="14" rx="3" fill="#03a9f4"/>
  <text x="108" y="296" fill="#e0e0e0" font-size="13">backup.local</text>
  <rect x="84" y="314" width="14" height="14" rx="3" fill="#03a9f4"/>
  <text x="108" y="326" fill="#e0e0e0" font-size="13">hassio.local</text>

  <!-- Buttons -->
  <rect x="276" y="356" width="70" height="32" rx="6" fill="#2a2a2a"/>
  <text x="311" y="377" fill="#e0e0e0" font-size="13" text-anchor="middle">Cancel</text>
  <rect x="356" y="356" width="70" height="32" rx="6" fill="#03a9f4"/>
  <text x="391" y="377" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Create</text>

  <text x="84" y="412" fill="#666" font-size="11" font-style="italic">Mock-up — illustrative, not a live capture</text>
</svg>
